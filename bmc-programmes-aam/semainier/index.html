<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Semainier · Black Mountain College</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="lib/event-calendar.min.css">
<style>
  :root { --papier:#f6f3ec; --encre:#1d1b18; --gris:#6d6a63; --filet:#d8d3c7; --accent:#8a2b1d; }
  * { box-sizing:border-box; }
  html { height:100%; }
  body { margin:0; height:100%; display:flex; flex-direction:column; background:var(--papier); color:var(--encre);
    font:14px/1.4 -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; padding:10px 16px;
    border-bottom:1px solid var(--filet); }
  header h1 { font-size:15px; margin:0; letter-spacing:.02em; }
  header h1 small { font-weight:normal; color:var(--gris); }
  .grp { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  button, select, input { font:inherit; }
  button { background:#fff; border:1px solid var(--filet); border-radius:3px; padding:3px 8px; cursor:pointer; }
  button:hover { border-color:var(--gris); }
  button.on { background:var(--encre); color:#fff; border-color:var(--encre); }
  input[type=search] { width:190px; padding:3px 6px; border:1px solid var(--filet); border-radius:3px; }
  .fam { display:inline-flex; align-items:center; gap:4px; font-size:12px; cursor:pointer; user-select:none; }
  .fam i { width:11px; height:11px; border-radius:2px; display:inline-block; }
  .fam input { margin:0; }
  main { display:flex; flex:1; min-height:0; }
  #cal { flex:1; min-width:0; padding:8px 8px 8px 12px; }
  #cote { width:360px; flex:none; overflow-y:auto; border-left:1px solid var(--filet); padding:10px 14px 30px; }
  #cote h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--gris);
    margin:18px 0 6px; border-bottom:1px solid var(--filet); padding-bottom:3px; }
  #cote h2:first-child { margin-top:4px; }
  .vide { color:var(--gris); font-style:italic; font-size:12px; }
  .per { margin:4px 0; font-size:13px; }
  .per b { font-weight:600; }
  .pct { display:inline-block; font-size:10px; padding:0 4px; border-radius:7px; background:#e9e4d8;
    color:#555; vertical-align:1px; white-space:nowrap; }
  .pct.p0 { background:#dfe9da; color:#2f5a25; }
  .pct.p30 { background:#f1d9cf; color:#7a2a12; }
  .doc { display:flex; gap:8px; margin:7px 0; font-size:12px; text-decoration:none; color:inherit; }
  .doc img { width:62px; height:80px; object-fit:cover; background:#e6e1d6; flex:none; border:1px solid var(--filet); }
  .doc .t { font-weight:600; }
  .doc:hover .t { text-decoration:underline; }
  .doc .m { color:var(--gris); }
  .pers { display:flex; flex-wrap:wrap; gap:3px 5px; }
  .pers a { font-size:12px; color:var(--encre); text-decoration:none; border-bottom:1px dotted var(--gris); cursor:pointer; }
  .pers a sup { color:var(--gris); }
  details summary { cursor:pointer; font-size:12px; color:var(--gris); }
  .cours { font-size:12px; margin:4px 0 4px 8px; }
  .cours .q { color:var(--gris); }
  .legende { font-size:11px; color:var(--gris); }
  .legende span { display:inline-block; width:22px; height:10px; vertical-align:-1px; margin:0 3px 0 8px; border:1px solid #999; }
  @media (max-width: 1000px) { main { flex-direction:column; overflow:auto; } #cal { flex:none; height:80vh; }
    #cote { width:auto; border-left:0; border-top:1px solid var(--filet); overflow:visible; } }
  /* événements */
  .ec-event { cursor:pointer; }
  .ec-event.d-mid { opacity:.78; }
  .ec-event.d-haut { background-image:repeating-linear-gradient(135deg, rgba(255,255,255,.38) 0 4px, transparent 4px 8px); opacity:.72; }
  .ec-event.approx { outline:1.5px dashed rgba(0,0,0,.55); outline-offset:-2px; }
  .ec-event.spec { border:1.5px dashed currentColor; font-style:italic; }
  .fam i.ispec { background:#fff; border:1.5px dashed #555; }
  /* couche Duberman : couleur propre (sarcelle), filet épais à gauche */
  .ec-event.dub { border-left:4px solid #0b4f4f; }
  .fam i.idub { background:#1f7f7f; border-left:3px solid #0b4f4f; }
  .dubp { font-size:12px; margin:5px 0; padding:3px 6px; border-left:3px solid #1f7f7f; background:#eef6f6; cursor:pointer; }
  .dubp:hover { background:#e0eeee; }
  /* couche Scénario (extraction automatique de 60 livres) : prune, filet pointillé à gauche */
  .ec-event.scen { border-left:4px dotted #4a1f3a; }
  .fam i.iscen { background:#8b3a6b; border-left:3px dotted #4a1f3a; }
  .scenp { font-size:12px; margin:5px 0; padding:3px 6px; border-left:3px dotted #8b3a6b; background:#f6eef3; cursor:pointer; }
  .scenp:hover { background:#efe0ea; }
  /* vérification des sources */
  .verif { margin-top:14px; border-top:2px solid var(--filet); padding-top:8px; font-size:12.5px; }
  .verif .ext { background:#faf8f2; border:1px solid var(--filet); padding:6px 8px; margin:6px 0; font-family:Georgia, serif; line-height:1.45; }
  .verif mark { background:#ffe58a; padding:0 1px; }
  .st { display:inline-block; font-size:11px; padding:1px 7px; border-radius:8px; font-weight:600; }
  .st.ok { background:#dfe9da; color:#2f5a25; } .st.faible { background:#f3ecd3; color:#6a5414; }
  .st.relire { background:#f1d9cf; color:#7a2a12; } .st.manque { background:#7a2a12; color:#fff; }
  /* synthèses du scénario (chronique du mois, dossiers) */
  .chron { font-size:12.5px; border-left:3px double #8b3a6b; padding:2px 8px; margin:6px 0; background:#fbf7f9; }
  .chron p { margin:4px 0; }
  .ref { display:inline-block; font-size:10px; padding:0 4px; margin:0 1px; border:1px solid #c9a5bb; border-radius:6px; color:#6a2a52; cursor:pointer; background:#fff; }
  .ref:hover { background:#f3e3ec; }
  .pp { display:inline-block; font-size:11.5px; margin:1px 4px 1px 0; }
  .pp.ok::after { content:" ✓"; color:#2f5a25; } .pp.non { color:var(--gris); }
  .dossier-lien { font-size:10px; color:#8b3a6b; cursor:pointer; margin-left:1px; }
  /* couche Chronos (extractions automatiques de décembre 2025 : fiches du musée, entretiens Harris, ferme) */
  .ec-event.chr { border-left:4px dashed #3d4a12; }
  .fam i.ichr { background:#6b7a1f; border-left:3px dashed #3d4a12; }
  .chrp { font-size:12px; margin:5px 0; padding:3px 6px; border-left:3px dashed #6b7a1f; background:#f3f5e8; cursor:pointer; }
  .renvoi.rs { border-left:3px dotted #8b3a6b; background:#f8f1f5; }
  .renvoi { border-left:3px solid #1f7f7f; padding:2px 6px; margin:3px 0; background:#f3f8f8; }
  .reconst { background:#fff; border:1.5px dashed var(--gris); padding:8px 10px; font-size:12.5px; margin:6px 0; }
  #fiche h4 { font-size:14px; margin:16px 0 4px; } #fiche table { border-collapse:collapse; font-size:12px; } #fiche td { border-top:1px solid #eee; padding:2px 6px; vertical-align:top; }
  .ev-b { font-size:9.5px; opacity:.9; margin-left:3px; white-space:nowrap; }
  .ec-timeline .ec-event { font-size:11px; }
  /* ---- journal de la semaine (vue par défaut, 2/11/2026) ----
     attesté et reconstitué séparés (colonnes parallèles de Lenglet Du Fresnoy) ; certitude en marques discrètes
     (●●● à ○○○, d'après les points de Priestley) plutôt qu'en flou, toujours avec la couche écrite et la part déduite */
  #journal { flex:1; min-width:0; overflow-y:auto; padding:10px 18px 40px; display:none; }
  body.j #journal { display:block; } body.j #cal { display:none; }
  .j-tete { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px; margin:2px 0 4px; }
  .j-tete h2 { font:600 22px/1.2 Georgia, "Times New Roman", serif; margin:0; }
  .j-tete .per { color:var(--gris); font-size:13px; margin:0; }
  .j-nav button { font-size:13px; }
  #frise { width:100%; height:46px; display:block; margin:6px 0 2px; cursor:pointer; }
  .frise-leg { display:flex; justify-content:space-between; font-size:10.5px; color:var(--gris); margin-bottom:10px; }
  .j-leg { font-size:11.5px; color:var(--gris); margin:4px 0 12px; line-height:1.7; }
  .j-leg b { color:var(--encre); font-weight:600; }
  .j-bloc { margin:14px 0 22px; }
  .j-bloc > h3 { font:600 12px/1.3 -apple-system, "Helvetica Neue", Arial, sans-serif; text-transform:uppercase; letter-spacing:.07em;
    color:var(--gris); border-bottom:1.5px solid var(--encre); padding-bottom:4px; margin:0 0 6px; display:flex; justify-content:space-between; gap:10px; }
  .j-bloc > h3 small { text-transform:none; letter-spacing:0; font-weight:normal; }
  .j-jour { display:grid; grid-template-columns:92px 1fr; gap:0 12px; border-bottom:1px solid var(--filet); padding:6px 0; }
  .j-jour > .d { font:600 13px/1.3 Georgia, serif; padding-top:2px; }
  .j-jour > .d small { display:block; font:11px -apple-system, Arial, sans-serif; color:var(--gris); }
  .j-jour.vide-j > .l { color:var(--gris); font-size:12px; font-style:italic; padding-top:3px; }
  .j-ev { display:grid; grid-template-columns:44px 1fr auto; gap:0 10px; padding:3px 4px; border-radius:3px; cursor:pointer; align-items:baseline; }
  .j-ev:hover { background:#fff; }
  .j-ev .h { font-variant-numeric:tabular-nums; color:var(--gris); font-size:12px; }
  .j-ev .t { font-size:13.5px; }
  .j-ev .m { font-size:11.5px; color:var(--gris); display:block; margin-top:1px; }
  .j-ev .c { white-space:nowrap; text-align:right; font-size:11px; }
  .cert { letter-spacing:1px; font-size:10px; color:var(--encre); }
  .couche { display:inline-block; font-size:10px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; padding:0 4px;
    border-radius:2px; color:#fff; margin-right:4px; vertical-align:1px; }
  .couche.aam { background:#3d3a35; } .couche.dub { background:#1f7f7f; } .couche.chr { background:#6b7a1f; }
  .couche.rum { background:#8a5a1d; } .couche.scen { background:#8b3a6b; } .couche.spec { background:#fff; color:var(--gris); border:1px dashed var(--gris); }
  .aussi { font-size:11px; color:#1f5f5f; }
  .j-ev .fam-pt { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:0; }
  .j-spec-resume { font-size:12.5px; background:#fff; border:1.5px dashed var(--gris); padding:8px 10px; margin:4px 0 8px; }
  table.edt { border-collapse:collapse; width:100%; font-size:11.5px; table-layout:fixed; }
  table.edt th { font-weight:600; text-align:left; padding:3px 4px; border-bottom:1px solid var(--encre); font-size:11px; }
  table.edt th:first-child { width:52px; }
  table.edt td { vertical-align:top; border-bottom:1px solid var(--filet); padding:3px 4px; font-style:italic; color:#4b4740; }
  table.edt td.hr { font-style:normal; color:var(--gris); font-variant-numeric:tabular-nums; }
  table.edt .ci { cursor:pointer; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  table.edt .ci:hover { text-decoration:underline; }
  table.edt details summary { font-style:normal; color:var(--encre); font-size:11.5px; }
  .edt-mobile { display:none; }
  .j-periode { margin-top:10px; padding:6px 8px 4px; background:#efebe1; border-radius:3px; }
  .j-sous { font:600 12.5px/1.4 Georgia, serif; margin-bottom:3px; }
  .j-periode .j-ev { grid-template-columns:96px 1fr auto; } .j-periode .j-ev .h { font-size:11px; }
  @media (max-width: 760px) { .j-periode .j-ev { grid-template-columns:1fr; } .j-periode .j-ev .c { grid-column:1; } }
  .j-periode details summary { margin:4px 0; }
  table.edt .ci.att, .edt-mobile .ci.att { font-style:normal; color:var(--encre); font-weight:500; }
  table.edt .ci.att::before, .edt-mobile .ci.att::before { content:"● "; font-size:8px; vertical-align:1px; }
  .edt-mobile .ci { display:block; font-style:italic; color:#4b4740; cursor:pointer; }
  .ci-leg.spec { font-style:italic; } .ci-leg.att { font-weight:500; }
  @media (max-width: 760px) {
    .j-jour { grid-template-columns:1fr; } .j-jour > .d { border-bottom:1px dotted var(--filet); margin-bottom:3px; }
    .j-ev { grid-template-columns:40px 1fr; } .j-ev .c { grid-column:2; text-align:left; }
    table.edt { display:none; } .edt-mobile { display:block; }
    #journal { padding:8px 10px 30px; }
  }
  header details#filtres { flex-basis:100%; } header details#filtres > summary { font-size:12px; color:var(--gris); cursor:pointer; }
  header details#filtres[open] > summary { margin-bottom:6px; }
  header details#filtres > div { display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; }
  .j-semaine { font-size:12px; color:var(--gris); margin-top:6px; }
  .j-semaine .lien, .j-rec .lien { cursor:pointer; text-decoration:underline dotted; color:var(--encre); }
  .j-rec { border-bottom:1px solid var(--filet); padding:6px 0 8px; font-size:12.5px; }
  .j-rec .lib { font:600 12px/1.3 Georgia, serif; margin-right:6px; }
  .j-rec .it { display:inline-block; margin:2px 14px 2px 0; }
  .j-rec .it small { color:var(--gris); }
  @media (max-width: 1000px) { #journal { flex:none; overflow:visible; } }
  @media (max-width: 760px) { .frise-leg span:nth-child(2) { display:none; } }
  .j-leg > summary { font-size:11.5px; color:var(--gris); }
  /* ---- semainier à 7 colonnes (3/11/2026) */
  body.j #cote { display:none; } body.j.ctx-on #cote { display:block; }
  body.j label.fam:has(#spec), body.j label.fam:has(#dub), body.j label.fam:has(#chr), body.j label.fam:has(#scen) { display:none; }
  .j-tete .ctx { margin-left:auto; font-size:12px; } .j-tete .ctx.on { background:var(--encre); color:#fff; }
  .opts { display:flex; flex-wrap:wrap; gap:5px 6px; align-items:center; margin:2px 0 8px; }
  .opt { display:inline-flex; align-items:center; gap:5px; font-size:12px; padding:3px 8px 3px 6px; border:1px solid var(--filet); border-radius:14px; background:#fff; cursor:pointer; user-select:none; }
  .opt input { display:none; } .opt i { width:10px; height:10px; border-radius:2px; display:inline-block; }
  .opt b { font-weight:600; font-size:11px; color:var(--gris); }
  .opt:not(.on) { background:transparent; color:var(--gris); text-decoration:line-through; text-decoration-color:#bbb; }
  .opt:not(.on) i { opacity:.35; } .opt.zero { opacity:.55; }
  .couche.cb { text-transform:none; letter-spacing:0; font-weight:600; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:-2px; }
  .it .pied .couche.cb { font-size:9.5px; max-width:70%; display:inline-block; }
  .opt-g { display:inline-flex; flex-wrap:wrap; align-items:center; gap:4px 5px; margin-right:12px; }
  .opt-gt { font:600 10.5px -apple-system, Arial, sans-serif; text-transform:uppercase; letter-spacing:.05em; color:var(--gris); margin-right:2px; }
  .opts { flex-direction:column; align-items:flex-start; gap:4px; }
  .livres-sel { font-size:12px; margin:-2px 0 8px; } .livres-sel summary { color:var(--gris); }
  .livres-sel > div { display:flex; flex-wrap:wrap; gap:4px 5px; margin-top:4px; max-height:8em; overflow-y:auto; }
  .opts-tout { font-size:11.5px; color:var(--gris); margin-left:6px; } .opts-tout a { color:var(--gris); }
  .bande { background:#efebe1; border-radius:3px; padding:4px 8px; margin:0 0 8px; font-size:12px; }
  .bande summary { font:600 12px Georgia, serif; color:var(--encre); }
  .bande-l { display:flex; flex-wrap:wrap; gap:3px 14px; margin:4px 0 2px; max-height:9.5em; overflow-y:auto; }
  .bande.rec { background:#f3f1ea; } .rec-t { font:600 12px Georgia, serif; }
  .b-it { cursor:pointer; } .b-it:hover { text-decoration:underline; } .b-d { color:var(--gris); font-size:11px; }
  .sem-grid { display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:6px; align-items:start; }
  .sem-col { background:#fff; border:1px solid var(--filet); border-radius:4px; padding-bottom:4px; min-width:0; }
  .sem-col.vide { background:transparent; }
  .sem-j { padding:5px 7px 4px; border-bottom:2px solid var(--encre); font:13px/1.25 Georgia, serif; position:sticky; top:0; background:#faf8f3; z-index:1; }
  .sem-j b { text-transform:capitalize; } .sem-j small { display:block; font:10.5px -apple-system, Arial, sans-serif; color:var(--gris); min-height:13px; }
  .rien { color:#bbb; text-align:center; padding:8px; }
  .it { margin:4px 4px 0; padding:3px 5px 3px 6px; border-left:3px solid #999; background:#fbfaf7; border-radius:0 3px 3px 0; font-size:12px; line-height:1.28; cursor:pointer; }
  .it:hover { background:#f2efe7; }
  .it .h { display:block; font-weight:600; font-size:10.5px; color:var(--gris); font-variant-numeric:tabular-nums; }
  .it .t { display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .it .pied { display:block; margin-top:2px; font-size:10px; white-space:nowrap; overflow:hidden; }
  .it .pied .couche { font-size:8.5px; padding:0 3px; } .it .pied .cert { font-size:8.5px; margin-right:3px; }
  .it.spec { font-style:italic; border-left-style:dashed; background:#fff; color:#4b4740; outline:1px dashed #e0dbcf; outline-offset:-1px; }
  .it.grp { cursor:default; } .it.grp .t { font-style:normal; font-weight:600; font-size:11px; color:var(--gris); }
  .it { overflow:hidden; min-width:0; } .it .g { display:block; max-width:100%; min-width:0; } .g-it { display:block; max-width:100%; cursor:pointer; padding:1px 0; border-bottom:1px dotted #eee; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .g-it:hover { text-decoration:underline; } .g-it small { color:var(--gris); }
  @media (max-width: 1100px) { .sem-grid { grid-template-columns:repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 760px) { .sem-grid { grid-template-columns:1fr; } .sem-j { position:static; } .it .t { -webkit-line-clamp:unset; } }
  /* fiche */
  #voile { position:fixed; inset:0; background:rgba(20,18,15,.45); display:none; align-items:center; justify-content:center; z-index:50; }
  #voile.on { display:flex; }
  #fiche { background:#fff; max-width:640px; width:92%; max-height:86vh; overflow:auto; padding:18px 22px; border-radius:4px; }
  #fiche h3 { margin:0 0 4px; font-size:17px; }
  #fiche dl { display:grid; grid-template-columns:130px 1fr; gap:4px 12px; font-size:13px; margin:12px 0 0; }
  #fiche dt { color:var(--gris); }
  #fiche dd { margin:0; }
  #fiche .fermer { float:right; }
  #info { font-size:11px; color:var(--gris); }
</style>
</head>
<body>
<header>
  <h1>Semainier · Black Mountain College <small>d'après les fiches de l'Asheville Art Museum<span id="mention"></span></small></h1>
  <div class="grp">
    <button id="langue" title="Français / English">EN</button>
    <button data-vue="journal" class="on" title="Les 7 jours de la semaine ; les options choisissent ce qui apparaît dans chaque jour">Semaine</button>
    <button data-vue="timeGridWeek" title="Grille horaire (lisible surtout pour les semaines à horaire attesté)">Grille</button>
    <button data-vue="presences">Présences</button>
    <button data-vue="listWeek">Liste</button>
    <button data-vue="dayGridMonth">Mois</button>
  </div>
  <div class="grp">
    <button id="precSem" title="Semaine documentée précédente">◀ doc.</button>
    <input type="date" id="saut" min="1933-09-01" max="1957-12-31">
    <button id="suivSem" title="Semaine documentée suivante">doc. ▶</button>
    <select id="reperes" style="max-width:190px"><option value="">Repères…</option></select>
  </div>
  <details id="filtres"><summary>Filtres : types d'activité, recherche, part déduite</summary><div>
  <div class="grp">
    <input type="search" id="q" placeholder="Personne, cours, lieu…">
    <label class="fam" title="Part de déduction maximale affichée">déduction ≤ <select id="maxPct">
      <option>0</option><option>10</option><option>20</option><option>30</option><option>50</option><option>60</option><option>75</option><option selected>100</option></select> %</label>
  </div>
  <div class="grp" id="familles"></div>
  <label class="fam" title="Semaines reconstituées à partir de sources indirectes"><input type="checkbox" id="spec" checked><i class="ispec"></i>Reconstitution (emploi du temps)</label>

function analyse(k) {
  if (D.spec && D.spec[k] && !D.spec[k].gabarits) { chargerSpec(k).then(() => analyse(k)); return; }
  const md = ((D.spec || {})[k] || {}).analyse; if (!md) return;
  const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>").replace(/`(.+?)`/g, "<code>$1</code>");
  let h = "", liste = false;
  for (const l of md.split("\n")) {
    if (/^- /.test(l)) { if (!liste) { h += "<ul>"; liste = true; } h += `<li>${inl(l.slice(2))}</li>`; continue; }
    if (/^  /.test(l) && liste) { h = h.replace(/<\/li>$/, "<br>" + inl(l.trim()) + "</li>"); continue; }
    if (liste) { h += "</ul>"; liste = false; }
    if (/^# /.test(l)) h += `<h3>${inl(l.slice(2))}</h3>`;
    else if (/^##+ /.test(l)) h += `<h4>${inl(l.replace(/^#+ /, ""))}</h4>`;
    else if (/^\|/.test(l)) { if (!/^\|---/.test(l)) h += `<table><tr>${l.split("|").slice(1, -1).map(c => `<td>${inl(c.trim())}</td>`).join("")}</tr></table>`; }
    else if (l.trim()) h += `<p>${inl(l)}</p>`;
  }
  if (liste) h += "</ul>";
  document.getElementById("fiche").innerHTML = `<button class="fermer" onclick="fermer()">fermer</button>${h}`;
  document.getElementById("voile").classList.add("on");
}

// frise 1933-1957 : faits attestés par semaine (barres), semaines reconstituées (fond gris)
const FRISE = (() => {
  const t0 = new Date("1933-09-04T12:00"), n = Math.ceil((new Date("1958-01-06T12:00") - t0) / 6048e5);
  const att = new Array(n).fill(0), spc = new Array(n).fill(0);
  const ix = d => Math.floor((new Date(d.slice(0, 10) + "T12:00") - t0) / 6048e5);
  D.events.concat(D.duberman, CHR.grille, SC.grille).forEach(e => { const k = ix(e.start); if (k >= 0 && k < n && !e.extendedProps.spec) att[k]++; });
  for (const Y of Object.values(D.spec || {})) for (const S of Y.semaines) { const k = ix(S.lundi); if (k >= 0 && k < n) spc[k] = 1; }
  return { t0, n, att, spc, max: Math.max(...att), ix };
})();
function dessinerFrise(lun) {
  const c = document.getElementById("frise"); if (!c) return;
  const w = c.clientWidth, h = c.clientHeight, r = window.devicePixelRatio || 1;
  c.width = w * r; c.height = h * r; const g = c.getContext("2d"); g.scale(r, r);
  const bw = w / FRISE.n, base = h - 12;
  for (let k = 0; k < FRISE.n; k++) {
    if (FRISE.spc[k]) { g.fillStyle = "#e4dfd3"; g.fillRect(k * bw, 4, Math.max(bw, 1), base - 4); }
    if (FRISE.att[k]) { const bh = Math.max(2, Math.sqrt(FRISE.att[k] / FRISE.max) * (base - 6)); g.fillStyle = "#3d3a35"; g.fillRect(k * bw, base - bh, Math.max(bw * .8, 1), bh); }
  }
  g.fillStyle = "#6d6a63"; g.font = "9px sans-serif";
  for (let y = 1934; y <= 1957; y++) { const k = FRISE.ix(`${y}-01-01`); g.fillRect(k * bw, base, 1, y % 5 ? 3 : 6); if (y % 5 === 0) g.fillText(y, k * bw + 2, h - 1); }
  const k = FRISE.ix(lun); g.fillStyle = "#c0392b"; g.fillRect(k * bw - 1, 0, 3, base);
  c.onclick = ev => { const x = ev.offsetX, kk = Math.floor(x / bw); const d = new Date(FRISE.t0); d.setDate(d.getDate() + 7 * kk); aller(iso(d)); };
  c.title = "Cliquer pour aller à cette semaine";
}

  try { Object.assign(d, JSON.parse(localStorage.getItem("bmc-vis2") || "{}")); } catch (e) {} return d; })();

  if (VIS.periode && largesVus.length) {

    h += `<details class="bande" open><summary>${t("Datés au mois ou à la saison, sans jour précis")} (${largesVus.length})</summary><div class="bande-l">${largesVus.map(e => {
      const i = EVJ.push(e) - 1, p = e.extendedProps, [ck, cl] = couche(p);
      return `<span class="b-it" data-i="${i}" title="${esc(srcCourt(p))}"><span class="b-d">${esc(dateLarge(e))}</span> ${esc(titreTr(e))} ${badgeCol(e)}${pctTag(+p.pct)}</span>`; }).join("")}</div></details>`;
  }
  // 7 colonnes
  const fam = e => (FAM_DE[e.extendedProps.type] || FAMILLES[4])[2];
  const carte = e => { const i = EVJ.push(e) - 1, p = e.extendedProps;

    return `<div class="it${p.spec ? " spec" : ""}" data-i="${i}" style="border-left-color:${fam(e)}" title="${esc(tx(e.title) + (p.qui ? " · " + p.qui : "") + " · " + srcCourt(p))}">

  const groupe = (hr, L, spec) => { const it = L.map(e => { const i = EVJ.push(e) - 1, p = e.extendedProps;
      return `<span class="g-it" data-i="${i}" title="${esc(tx(e.title) + (p.qui ? " · " + p.qui : "") + " · " + t("Part déduite") + " " + p.pct + " %")}">${esc(titreTr(e))}${p.qui ? ` <small>${esc(p.qui.split(";")[0])}</small>` : ""}</span>`; }).join("");

  const semaineEntiere = vus.filter(e => e.allDay && e.end && e.end.slice(0, 10) >= plusJours(e.start.slice(0, 10), 7));
  // récurrences attestées (« chaque jour », « chaque lundi ») : une ligne pour la semaine, pas une case par jour

      Boxes <i>in italics, with a dotted rule</i> are reconstructed: the term timetable established by cross-analysing catalogues, bulletins, course lists, student records and testimonies, then applied to each teaching week; each keeps its deduced share and the reasons for it.
