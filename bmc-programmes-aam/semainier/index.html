<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Semainier · Black Mountain College</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="lib/event-calendar.min.css">
<style>
  :root { --papier:#f6f3ec; --encre:#1d1b18; --gris:#6d6a63; --filet:#d8d3c7; --accent:#8a2b1d; }
  * { box-sizing:border-box; }
  html { height:100%; }
  body { margin:0; height:100%; display:flex; flex-direction:column; background:var(--papier); color:var(--encre);
    font:14px/1.4 -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; padding:10px 16px;
    border-bottom:1px solid var(--filet); }
  header h1 { font-size:15px; margin:0; letter-spacing:.02em; }
  header h1 small { font-weight:normal; color:var(--gris); }
  .grp { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  button, select, input { font:inherit; }
  button { background:#fff; border:1px solid var(--filet); border-radius:3px; padding:3px 8px; cursor:pointer; }
  button:hover { border-color:var(--gris); }
  button.on { background:var(--encre); color:#fff; border-color:var(--encre); }
  input[type=search] { width:190px; padding:3px 6px; border:1px solid var(--filet); border-radius:3px; }
  .fam { display:inline-flex; align-items:center; gap:4px; font-size:12px; cursor:pointer; user-select:none; }
  .fam i { width:11px; height:11px; border-radius:2px; display:inline-block; }
  .fam input { margin:0; }
  main { display:flex; flex:1; min-height:0; }
  #cal { flex:1; min-width:0; padding:8px 8px 8px 12px; }
  #cote { width:360px; flex:none; overflow-y:auto; border-left:1px solid var(--filet); padding:10px 14px 30px; }
  #cote h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--gris);
    margin:18px 0 6px; border-bottom:1px solid var(--filet); padding-bottom:3px; }
  #cote h2:first-child { margin-top:4px; }
  .vide { color:var(--gris); font-style:italic; font-size:12px; }
  .per { margin:4px 0; font-size:13px; }
  .per b { font-weight:600; }
  .pct { display:inline-block; font-size:10px; padding:0 4px; border-radius:7px; background:#e9e4d8;
    color:#555; vertical-align:1px; white-space:nowrap; }
  .pct.p0 { background:#dfe9da; color:#2f5a25; }
  .pct.p30 { background:#f1d9cf; color:#7a2a12; }
  .doc { display:flex; gap:8px; margin:7px 0; font-size:12px; text-decoration:none; color:inherit; }
  .doc img { width:62px; height:80px; object-fit:cover; background:#e6e1d6; flex:none; border:1px solid var(--filet); }
  .doc .t { font-weight:600; }
  .doc:hover .t { text-decoration:underline; }
  .doc .m { color:var(--gris); }
  .pers { display:flex; flex-wrap:wrap; gap:3px 5px; }
  .pers a { font-size:12px; color:var(--encre); text-decoration:none; border-bottom:1px dotted var(--gris); cursor:pointer; }
  .pers a sup { color:var(--gris); }
  details summary { cursor:pointer; font-size:12px; color:var(--gris); }
  .cours { font-size:12px; margin:4px 0 4px 8px; }
  .cours .q { color:var(--gris); }
  .legende { font-size:11px; color:var(--gris); }
  .legende span { display:inline-block; width:22px; height:10px; vertical-align:-1px; margin:0 3px 0 8px; border:1px solid #999; }
  @media (max-width: 1000px) { main { flex-direction:column; overflow:auto; } #cal { flex:none; height:80vh; }
    #cote { width:auto; border-left:0; border-top:1px solid var(--filet); overflow:visible; } }
  /* événements */
  .ec-event { cursor:pointer; }
  .ec-event.d-mid { opacity:.78; }
  .ec-event.d-haut { background-image:repeating-linear-gradient(135deg, rgba(255,255,255,.38) 0 4px, transparent 4px 8px); opacity:.72; }
  .ec-event.approx { outline:1.5px dashed rgba(0,0,0,.55); outline-offset:-2px; }
  .ec-event.spec { border:1.5px dashed currentColor; font-style:italic; }
  .fam i.ispec { background:#fff; border:1.5px dashed #555; }
  /* couche Duberman : couleur propre (sarcelle), filet épais à gauche */
  .ec-event.dub { border-left:4px solid #0b4f4f; }
  .fam i.idub { background:#1f7f7f; border-left:3px solid #0b4f4f; }
  .dubp { font-size:12px; margin:5px 0; padding:3px 6px; border-left:3px solid #1f7f7f; background:#eef6f6; cursor:pointer; }
  .dubp:hover { background:#e0eeee; }
  /* couche Scénario (extraction automatique de 60 livres) : prune, filet pointillé à gauche */
  .ec-event.scen { border-left:4px dotted #4a1f3a; }
  .fam i.iscen { background:#8b3a6b; border-left:3px dotted #4a1f3a; }
  .scenp { font-size:12px; margin:5px 0; padding:3px 6px; border-left:3px dotted #8b3a6b; background:#f6eef3; cursor:pointer; }
  .scenp:hover { background:#efe0ea; }
  /* vérification des sources */
  .verif { margin-top:14px; border-top:2px solid var(--filet); padding-top:8px; font-size:12.5px; }
  .verif .ext { background:#faf8f2; border:1px solid var(--filet); padding:6px 8px; margin:6px 0; font-family:Georgia, serif; line-height:1.45; }
  .verif mark { background:#ffe58a; padding:0 1px; }
  .st { display:inline-block; font-size:11px; padding:1px 7px; border-radius:8px; font-weight:600; }
  .st.ok { background:#dfe9da; color:#2f5a25; } .st.faible { background:#f3ecd3; color:#6a5414; }
  .st.relire { background:#f1d9cf; color:#7a2a12; } .st.manque { background:#7a2a12; color:#fff; }
  /* synthèses du scénario (chronique du mois, dossiers) */
  .chron { font-size:12.5px; border-left:3px double #8b3a6b; padding:2px 8px; margin:6px 0; background:#fbf7f9; }
  .chron p { margin:4px 0; }
  .ref { display:inline-block; font-size:10px; padding:0 4px; margin:0 1px; border:1px solid #c9a5bb; border-radius:6px; color:#6a2a52; cursor:pointer; background:#fff; }
  .ref:hover { background:#f3e3ec; }
  .pp { display:inline-block; font-size:11.5px; margin:1px 4px 1px 0; }
  .pp.ok::after { content:" ✓"; color:#2f5a25; } .pp.non { color:var(--gris); }
  .dossier-lien { font-size:10px; color:#8b3a6b; cursor:pointer; margin-left:1px; }
  /* couche Chronos (extractions automatiques de décembre 2025 : fiches du musée, entretiens Harris, ferme) */
  .ec-event.chr { border-left:4px dashed #3d4a12; }
  .fam i.ichr { background:#6b7a1f; border-left:3px dashed #3d4a12; }
  .chrp { font-size:12px; margin:5px 0; padding:3px 6px; border-left:3px dashed #6b7a1f; background:#f3f5e8; cursor:pointer; }
  .renvoi.rs { border-left:3px dotted #8b3a6b; background:#f8f1f5; }
  .renvoi { border-left:3px solid #1f7f7f; padding:2px 6px; margin:3px 0; background:#f3f8f8; }
  .reconst { background:#fff; border:1.5px dashed var(--gris); padding:8px 10px; font-size:12.5px; margin:6px 0; }
  #fiche h4 { font-size:14px; margin:16px 0 4px; } #fiche table { border-collapse:collapse; font-size:12px; } #fiche td { border-top:1px solid #eee; padding:2px 6px; vertical-align:top; }
  .ev-b { font-size:9.5px; opacity:.9; margin-left:3px; white-space:nowrap; }
  .ec-timeline .ec-event { font-size:11px; }
  /* fiche */
  #voile { position:fixed; inset:0; background:rgba(20,18,15,.45); display:none; align-items:center; justify-content:center; z-index:50; }
  #voile.on { display:flex; }
  #fiche { background:#fff; max-width:640px; width:92%; max-height:86vh; overflow:auto; padding:18px 22px; border-radius:4px; }
  #fiche h3 { margin:0 0 4px; font-size:17px; }
  #fiche dl { display:grid; grid-template-columns:130px 1fr; gap:4px 12px; font-size:13px; margin:12px 0 0; }
  #fiche dt { color:var(--gris); }
  #fiche dd { margin:0; }
  #fiche .fermer { float:right; }
  #info { font-size:11px; color:var(--gris); }
</style>
</head>
<body>
<header>
  <h1>Semainier · Black Mountain College <small>d'après les fiches de l'Asheville Art Museum</small></h1>
  <div class="grp">
    <button data-vue="timeGridWeek" class="on">Semaine</button>
    <button data-vue="presences">Présences</button>
    <button data-vue="listWeek">Liste</button>
    <button data-vue="dayGridMonth">Mois</button>
  </div>
  <div class="grp">
    <button id="precSem" title="Semaine documentée précédente">◀ doc.</button>
    <input type="date" id="saut" min="1933-09-01" max="1957-12-31">
    <button id="suivSem" title="Semaine documentée suivante">doc. ▶</button>
    <select id="reperes" style="max-width:190px"><option value="">Repères…</option></select>
  </div>
  <div class="grp">
    <input type="search" id="q" placeholder="Personne, cours, lieu…">
    <label class="fam" title="Part de déduction maximale affichée">déduction ≤ <select id="maxPct">
      <option>0</option><option>10</option><option>20</option><option>30</option><option>50</option><option>60</option><option>75</option><option selected>100</option></select> %</label>
  </div>
  <div class="grp" id="familles"></div>
  <label class="fam" title="Semaines reconstituées à partir de sources indirectes"><input type="checkbox" id="spec" checked><i class="ispec"></i>Couche spéculative</label>
  <label class="fam" title="Événements tirés de Duberman, Black Mountain: An Exploration in Community (1972) ; les doublons avec l'AAM sont fondus dans la ligne AAM"><input type="checkbox" id="dub" checked><i class="idub"></i>Duberman</label>
  <label class="fam" title="N'afficher que les entrées dont la source citée a été ouverte et contient les témoins de l'entrée (scripts/verifier_sources.py)"><input type="checkbox" id="verifSeul">Retrouvées seulement</label>
  <label class="fam" title="Chronos : extractions automatiques (décembre 2025) des fiches du musée, des entretiens de Mary Emma Harris, du livre sur la ferme et de Duberman, seulement ce que l'AAM et Duberman n'ont pas déjà, à relire ; Rumaker : dépouillement manuel de Black Mountain Days (2003)"><input type="checkbox" id="chr" checked><i class="ichr"></i>Chronos, Rumaker</label>
  <label class="fam" title="Événements et scènes du scénario (extraction automatique, non relue, de 60 livres : bmc-scenario) ; les faits déjà dans l'AAM ou Duberman y sont fondus en renvoi"><input type="checkbox" id="scen" checked><i class="iscen"></i>Scénario</label>
</header>
<main>
  <div id="cal"></div>
  <aside id="cote"></aside>
</main>
<div id="voile"><div id="fiche"></div></div>

<script src="lib/event-calendar.min.js"></script>
<script src="data.js"></script>
<script src="data_scenario.js"></script>
<script src="data_chronos.js"></script>
<script>
const D = window.BMC;
const FAMILLES = [
  ["cours", "Cours, ateliers", "#3b6ea5", ["cours", "atelier"]],
  ["reunions", "Réunions", "#6b5b8c", ["reunion"]],
  ["scene", "Concerts, théâtre, danse", "#b0413e", ["concert", "theatre", "danse"]],
  ["conf", "Conférences, radio", "#c27a1a", ["conference", "radio"]],
  ["vie", "Vie de la communauté", "#4c8c4a", ["social", "travail", "expo", "visite", "sortie", "autre"]],
  ["cal", "Calendrier, examens", "#7d6a55", ["calendrier", "examen"]],
];
const FAM_DE = {}; FAMILLES.forEach(f => f[3].forEach(t => FAM_DE[t] = f));
const DUB_COULEUR = "#1f7f7f";
const SCEN_COULEUR = "#8b3a6b";
const CHR = window.BMC_CHRONOS || { grille: [], panneau: [], personnes: {} };
const CHR_COULEUR = "#6b7a1f";
const SC = window.BMC_SCEN || { grille: [], panneau: [], renvois: {}, personnes: {} };
const etat = { familles: new Set(FAMILLES.map(f => f[0])), maxPct: 100, q: "", spec: true, dub: true, scen: !!window.BMC_SCEN, chr: !!window.BMC_CHRONOS };
const teinte = (hex, k) => { const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v + (255 - v) * k)); return `rgb(${c.join(",")})`; };

D.events.forEach(e => {
  const f = FAM_DE[e.extendedProps.type] || FAMILLES[4];
  if (e.extendedProps.spec) { e.backgroundColor = teinte(f[2], .85); e.textColor = f[2]; } else e.backgroundColor = f[2];
  e.extendedProps.fam = f[0];
  e._txt = (e.title + " " + e.extendedProps.qui + " " + e.resourceIds.join(" ") + " " + e.extendedProps.lieu).toLowerCase();
});
D.duberman = D.duberman || []; D.duberman_panneau = D.duberman_panneau || [];
D.duberman.concat(D.duberman_panneau).forEach(e => {
  const f = FAM_DE[e.extendedProps.type] || FAMILLES[4];
  e.backgroundColor = DUB_COULEUR; e.extendedProps.fam = f[0];
  e._txt = (e.title + " " + e.extendedProps.qui + " " + e.resourceIds.join(" ") + " " + e.extendedProps.lieu + " duberman").toLowerCase();
});
CHR.grille.concat(CHR.panneau).forEach(e => {
  const f = FAM_DE[e.extendedProps.type] || FAMILLES[4];
  e.backgroundColor = CHR_COULEUR; e.extendedProps.fam = f[0];
  e._txt = (e.title + " " + e.extendedProps.qui + " " + e.resourceIds.join(" ") + " chronos " + e.extendedProps.source_chronos).toLowerCase();
});
SC.grille.concat(SC.panneau).forEach(e => {
  const f = FAM_DE[e.extendedProps.type] || FAMILLES[4];
  e.backgroundColor = SCEN_COULEUR; e.extendedProps.fam = f[0];
  e._txt = (e.title + " " + e.extendedProps.qui + " " + e.resourceIds.join(" ") + " " + e.extendedProps.lieu + " scenario scénario").toLowerCase();
});
// renvois du scénario dans les fiches AAM (id = n° de ligne) et Duberman (id = d + n° de ligne)
D.events.concat(D.duberman).forEach(e => { const r = SC.renvois[e.id]; if (r) e.extendedProps.scen = r; });
// personnes du scénario absentes des ressources (vue Présences)
{ const connus = new Set(D.resources.flatMap(g => g.children.map(c => c.id)));
  Object.entries(CHR.personnes).forEach(([q, n]) => { if (!connus.has(q)) { connus.add(q); D.resources[q === "(non nommé)" ? 1 : 0].children.push({ id: q, title: q, extendedProps: { n } }); } });
  Object.entries(SC.personnes).forEach(([q, n]) => { if (!connus.has(q)) D.resources[q === "(non nommé)" ? 1 : 0].children.push({ id: q, title: q, extendedProps: { n } }); }); }
const JOURS = [...new Set(D.events.map(e => e.start.slice(0, 10)))].sort();

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const pctTag = p => `<span class="pct ${p === 0 ? "p0" : p >= 30 ? "p30" : ""}" title="part déduite des sources">${p} %</span>`;
const fmt = s => new Date(s.length === 10 ? s + "T12:00" : s).toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long", year:"numeric"});

const cleVerif = (id, p) => p.vkey || id;
function garde(e) {
  const q = etat.q.toLowerCase().trim();
  if (etat.verifSeul && window.BMC_VERIF) { const v = BMC_VERIF[cleVerif(e.id, e.extendedProps)]; if (!v || v[0] !== "retrouvé") return false; }
  return etat.familles.has(e.extendedProps.fam) && e.extendedProps.pct <= etat.maxPct && (!q || e._txt.includes(q));
}
// vérification des sources : chargée à la demande (fichier lourd)
let verifEnCours = null;
const ficheOuverte = () => document.getElementById("voile").classList.contains("on");
function chargerVerif() {
  if (window.BMC_VERIF) return Promise.resolve();
  return verifEnCours ||= new Promise((ok, ko) => { const sc = document.createElement("script"); sc.src = "verification.js";
    sc.onload = ok; sc.onerror = () => { window.BMC_VERIF = {}; ok(); }; document.head.appendChild(sc); });
}
// synthèses du scénario : chargées en arrière-plan
let synthEnCours = null;
function chargerSynth() {
  if (window.BMC_SYNTH) return Promise.resolve();
  return synthEnCours ||= new Promise(ok => { const sc = document.createElement("script"); sc.src = "data_syntheses.js";
    sc.onload = ok; sc.onerror = () => { window.BMC_SYNTH = null; ok(); }; document.head.appendChild(sc); });
}
const refsHtml = refs => (refs || []).filter(r => /^[A-Z]{2}-\d{5}$/.test(r)).map(r => `<span class="ref" data-ref="${r}" title="ouvrir la fiche citée">${r}</span>`).join("");
// dossier d'une personne : nom exact, sinon nom de famille + initiale, sinon nom de famille unique
let IDX_DOSS = null;
function dossierDe(nom) {
  const Y = window.BMC_SYNTH; if (!Y) return null;
  if (!IDX_DOSS) { IDX_DOSS = {}; for (const k of Object.keys(Y.dossiers)) { const w = k.replace(/\(.*?\)/g, "").trim().split(/\s+/);
    (IDX_DOSS[w[w.length - 1].toLowerCase()] ||= []).push(k); } }
  if (Y.dossiers[nom]) return nom;
  const w = nom.trim().split(/\s+/), c = IDX_DOSS[w[w.length - 1].toLowerCase()] || [];
  const m = c.filter(k => k[0] === nom[0]); return m.length === 1 ? m[0] : c.length === 1 && w.length === 1 ? c[0] : null;
}
// lieux du collège : même motif que scripts/integrer_syntheses.py (texte sans accents, minuscules)
const platJS = t => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
function lieuDe(lieu) {
  const Y = window.BMC_SYNTH; if (!Y || !Y.lieux_motifs || !lieu) return null;
  const n = platJS(lieu), m = Y.lieux_motifs.find(([k, rx]) => new RegExp(rx).test(n));
  return m && Y.lieux[m[0]] ? m[0] : null;
}
function ouvrirLieu(cle) {
  const Y = window.BMC_SYNTH, l = Y.lieux[cle], rx = new RegExp(Y.lieux_motifs.find(m => m[0] === cle)[1]);
  const ici = D.events.filter(e => rx.test(platJS(e.extendedProps.lieu))).map(e => e.start.slice(0, 10)).sort();
  document.getElementById("fiche").innerHTML = `<button class="fermer" onclick="fermer()">fermer</button>
    <h3>${esc(cle)}</h3><div class="legende">Lieu du collège selon les livres (fiches « lieux » du scénario, extraction automatique) ; cliquer une référence pour sa source.</div>
    <div class="renvoi"><b>Recoupement</b> · ${ici.length ? `${ici.length} activité${ici.length > 1 ? "s" : ""} attestée${ici.length > 1 ? "s" : ""} à cet endroit dans l'AAM, du ${ici[0]} au ${ici[ici.length - 1]}` : "aucune activité AAM n'est située à cet endroit"}</div>
    ${l.map(x => `<h4>${esc(x.nom)} <span class="legende">· ${esc(x.per || "période non donnée")}</span> <span class="ref" data-ref="${x.id}">${x.id}</span></h4>
      ${x.desc ? `<div><i>Aspect.</i> ${esc(x.desc)}</div>` : ""}${x.usages ? `<div><i>Usages.</i> ${esc(x.usages)}</div>` : ""}${x.amb ? `<div><i>Ambiance.</i> ${esc(x.amb)}</div>` : ""}
      <div class="legende">${esc(x.s)}</div>`).join("")}`;
  document.getElementById("fiche").querySelectorAll(".ref").forEach(x => x.onclick = () => ouvrirRef(x.dataset.ref));
  document.getElementById("voile").classList.add("on");
}
function ouvrirRef(r) {
  const x = (window.BMC_SYNTH || {}).refs?.[r]; if (!x) return;
  const v = window.BMC_VERIF && (BMC_VERIF["f" + r] || BMC_VERIF["s" + r]);
  document.getElementById("fiche").innerHTML = `<button class="fermer" onclick="fermer()">fermer</button>
    <h3>${esc(x.t)}</h3><div>fiche ${r} du scénario · ${esc(x.d)} · certitude : ${esc(x.c)}</div>
    <dl><dt>Source</dt><dd>${esc(x.s)}</dd></dl>
    ${v ? blocVerif(r, { vkey: BMC_VERIF["f" + r] ? "f" + r : "s" + r, scenario: true }) : `<div class="verif legende">Vérification : ${window.BMC_VERIF ? "fiche non couverte par la dernière vérification" : "chargement…"}</div>`}`;
  document.getElementById("voile").classList.add("on");
  if (!window.BMC_VERIF) chargerVerif().then(() => { if (ficheOuverte()) ouvrirRef(r); });
}
function ouvrirDossier(nom) {
  const k = dossierDe(nom), Y = window.BMC_SYNTH; if (!k) return;
  const d = Y.dossiers[k];
  const moments = (l, titre) => l && l.length ? `<h4>${titre}</h4>` + l.map(m => `<div class="cours">${esc(m.date || "")} ${esc(m.moment || m.role || "")} ${refsHtml(m.refs)}</div>`).join("") : "";
  const att = Object.entries(d.atteste || {}).map(([b, v]) => `${b} : du ${v[0]} au ${v[1]} (${v[2]} activité${v[2] > 1 ? "s" : ""})`).join(" · ");
  document.getElementById("fiche").innerHTML = `<button class="fermer" onclick="fermer()">fermer</button>
    <h3>${esc(k)}</h3><div>${esc(d.dates_de_vie || "")} · ${esc(d.statut_bmc || d.statut || "")}</div>
    <div class="legende">Dossier du scénario : synthèse rédigée par un modèle de langage à partir des fiches ; seuls les éléments référencés sont repris (cliquer une référence pour voir sa source).</div>
    <h4>Présence à Black Mountain</h4>${(d.presence || []).map(p => `<div class="cours">${esc(p.debut || "?")} → ${esc(p.fin || "?")} : ${esc(p.role || "")} ${refsHtml(p.refs)}</div>`).join("")}
    <div class="renvoi"><b>Recoupement</b> · ${att ? esc(att) : "aucune activité de cette personne dans l'AAM ni datée au jour chez Duberman"}</div>

  if (sources.length) h += `<h2>Autres sources des activités affichées</h2>` + sources.map(carte).join("");

  const mid = new Date((debut.getTime() + fin.getTime()) / 2), y = mid.getFullYear();
  const an = mid.getMonth() >= 8 ? `${y}-${String((y + 1) % 100).padStart(2, "0")}` : `${y - 1}-${String(y % 100).padStart(2, "0")}`;
  const cours = D.cours.filter(c => c.periode.includes(an) || (c.periode.startsWith(String(y)) && !/^\d{4}-\d{2}/.test(c.periode))
    || (c.periode.includes(String(y)) && /summer/i.test(c.periode)));
  const parPer = {};
  cours.forEach(c => (parPer[c.periode] ||= []).push(c));
  h += `<h2>Cours offerts en ${an} (catalogues, bulletins)</h2>` + (cours.length ? Object.entries(parPer).map(([p, l]) =>
    `<details><summary>${esc(p)} — ${l.length}</summary>${l.map(c => `<div class="cours">${esc(c.cours)}
      ${c.qui && c.qui !== "—" ? `<span class="q">· ${esc(c.qui)}</span>` : ""}${c.horaire ? ` <span class="q">· ${esc(c.horaire)}</span>` : ""}
      ${pctTag(c.pct)} <a href="${esc(c.url)}" target="_blank" title="${esc(c.src)}">source</a></div>`).join("")}</details>`).join("")
    : `<div class="vide">Aucune liste de cours pour cette année.</div>`);
  if (etat.scen && window.BMC_SYNTH && BMC_SYNTH.cours) {
    const a0 = +an.slice(0, 4), cs = BMC_SYNTH.cours.filter(c => c.y0 && c.y0 <= a0 + 1 && (c.y1 || c.y0) >= a0);
    const precis = cs.filter(c => (c.y1 || c.y0) - c.y0 <= 2), larges = cs.filter(c => (c.y1 || c.y0) - c.y0 > 2);
    const carteC = c => `<div class="cours"><b>${esc(c.t)}</b> <span class="q">· ${esc(c.ens)} · ${esc(c.per)}</span> <span class="ref" data-ref="${c.id}">${c.id}</span>
      <br><span class="legende">${c.aam ? "AAM : " + esc(c.aam.replace("enseignant enseignant", "enseignant présent")) + (c.aam_cours ? " (« " + esc(c.aam_cours.slice(0, 80)) + " », " + esc(c.aam_per) + ")" : "") : ""}${c.bmc === "incertain" ? " · enseigné à BMC : incertain" : ""}</span>
      ${c.obj || c.ex.length || c.der ? `<details><summary>contenu</summary>${c.obj ? `<div><i>Objectifs.</i> ${esc(c.obj)}</div>` : ""}${c.ex.length ? `<div><i>Exercices.</i> ${c.ex.map(esc).join(" · ")}</div>` : ""}${c.mat ? `<div><i>Matériaux.</i> ${esc(typeof c.mat === "string" ? c.mat : JSON.stringify(c.mat))}</div>` : ""}${c.der ? `<div><i>Déroulé.</i> ${esc(c.der)}</div>` : ""}${c.prop ? `<div><i>Propos.</i> ${esc(typeof c.prop === "string" ? c.prop : JSON.stringify(c.prop))}</div>` : ""}${c.rea ? `<div><i>Réactions.</i> ${esc(typeof c.rea === "string" ? c.rea : JSON.stringify(c.rea))}</div>` : ""}<div class="legende">${esc(c.s)}</div></details>` : `<div class="legende">${esc(c.s)}</div>`}</div>`;
    if (cs.length) h += `<h2>Cours de ${an} selon les livres (scénario)</h2><div class="legende">Fiches « cours » extraites automatiquement des livres ; référence cliquable pour la source et sa vérification.</div>` +
      precis.map(carteC).join("") + (larges.length ? `<details><summary>${larges.length} cours datés sur plusieurs années</summary>${larges.map(carteC).join("")}</details>` : "");
  }

  h += `<h2>Lecture</h2><div class="legende">Couleur = famille d'activité.
    <span style="background:#3b6ea5"></span>attesté
    <span style="background:#3b6ea5;opacity:.75"></span>10–25 % déduit
    <span style="background:repeating-linear-gradient(135deg,#9db4d0 0 4px,#3b6ea5 4px 8px)"></span>≥ 30 % déduit
    <span style="background:#3b6ea5;outline:1.5px dashed #000;outline-offset:-2px"></span>heure indicative (« soir »…)
    <span style="background:#d8e2ed;border:1.5px dashed #3b6ea5"></span>couche spéculative (reconstitution)
    <span style="background:#1f7f7f;border-left:4px solid #0b4f4f"></span>Duberman (livre de 1972, « D. »)
    <span style="background:#8b3a6b;border-left:4px dotted #4a1f3a"></span>scénario (60 livres, extraction automatique, « S. »)<br>
    Cliquer une activité ouvre sa fiche : source exacte, part déduite et motifs.</div>
    <p id="info">Données générées le ${D.genere} · ${D.events.length} activités attestées (AAM) · ${D.duberman.length + D.duberman_panneau.length} événements Duberman · ${SC.grille.length + SC.panneau.length} entrées du scénario · ${D.documents.length} documents · calendrier : Event Calendar (MIT, vkurko).</p>`;
  const el = document.getElementById("cote");
  el.innerHTML = h;
  const la = el.querySelector("#lireAnalyse");
  if (la) la.onclick = ev => { ev.preventDefault(); analyse(la.dataset.k); };
  el.querySelectorAll(".chrp").forEach(x => x.onclick = () => { const e = CHR.panneau[+x.dataset.k];
    fiche({ id: e.id, title: e.title, start: new Date(e.start + "T12:00"), extendedProps: e.extendedProps }); });
  el.querySelectorAll(".scenp").forEach(x => x.onclick = () => { const e = SC.panneau[+x.dataset.k];
    fiche({ id: e.id, title: e.title, start: new Date(e.start + "T12:00"), extendedProps: e.extendedProps }); });
  el.querySelectorAll(".dubp").forEach(x => x.onclick = () => { const e = D.duberman_panneau[+x.dataset.k];
    fiche({ id: e.id, title: e.title, start: new Date(e.start + "T12:00"), extendedProps: e.extendedProps }); });
  el.querySelectorAll(".dossier-lien").forEach(x => x.onclick = () => ouvrirDossier(x.dataset.d));
  el.querySelectorAll(".ref").forEach(x => x.onclick = () => ouvrirRef(x.dataset.ref));
  el.querySelectorAll(".pers a").forEach(a => a.onclick = () => { qEl.value = a.dataset.q; etat.q = a.dataset.q; maj(); });
}

// ---- fiche d'une activité
function fiche(ev) {
  const p = ev.extendedProps;
  const d = iso(ev.start);
  const invs = p.inv.split(" ; "), urls = p.url.split(" "), srcs = p.src.split(" ; ");
  const doc = invs[0] ? D.documents.find(x => x.inv === invs[0]) : null;
  const liens = srcs.map((t, i) => `<a href="${esc(urls[i] || "")}" target="_blank">${esc(t)}</a>`).join("<br>");
  const ligne = (k, v) => v ? `<dt>${k}</dt><dd>${v}</dd>` : "";
  document.getElementById("fiche").innerHTML = `
    <button class="fermer" onclick="fermer()">fermer</button>
    <h3>${esc(ev.title)}</h3>
    <div>${fmt(d)}${p.heure ? " · " + esc(p.heure) : ""}${p.fin ? "–" + esc(p.fin) : ""} · ${esc(p.type)}</div>
    <dl>
      ${ligne("Qui", esc(p.qui))}
      ${ligne("Lieu", esc(p.lieu) + (lieuDe(p.lieu) ? ` <span class="dossier-lien" onclick="ouvrirLieu('${esc(lieuDe(p.lieu)).replace(/'/g, "\\'")}')" title="ce lieu selon les livres">ⓘ ${esc(lieuDe(p.lieu))}</span>` : ""))}
      ${ligne("Note", esc(p.note))}
      ${ligne("Part déduite", pctTag(p.pct) + " " + esc(p.motifs))}
      ${ligne("Récurrence", p.rec ? "occurrence calculée à partir d'une récurrence (grille, « chaque lundi »…)" : "")}
      ${ligne("Affichage", esc(p.placement))}
      ${ligne("Couche", p.spec ? `<b>spéculative</b> : reconstitution, pas un fait attesté · ${esc(p.terme)}, semaine ${p.semaine} · codes ${esc(p.codes)} · <a href="#" onclick="analyse('${esc(p.annee)}');return false">analyse de l'année</a>` : "")}
      ${p.unite ? ligne("Cours du catalogue", `<b>${esc(p.cours_catalogue)}</b>${p.precision ? " — " + esc(p.precision) : ""}<br><span class="legende">${esc(p.discipline)} · « Courses of Instruction » 1935-36 (2017.40.011, scans 011-08/09) · unité ${esc(p.unite)}</span>`) : ""}
      ${p.unite ? ligne("Parts déduites", `case ${esc(p.part_case_pct)} % · titre ${esc(p.part_titre_pct)} % (chance ${esc(p.chance)}) → total ${p.pct} %`) : ""}
      ${p.candidats ? ligne("Autres cours possibles", p.candidats.split(" | ").map(esc).join("<br>")) : ""}
      ${p.unite ? ligne("Rattachement", esc(p.rattachement)) : ""}
      ${p.unite ? ligne("Année précédente", esc(p.equivalent_avant)) : ""}
      ${p.unite ? ligne("Année suivante", esc(p.equivalent_apres)) : ""}
      ${p.duberman ? ligne("Couche", `<b>Duberman</b> : événement tiré du livre (${esc(p.categorie)}) · date dans le livre : ${esc(p.date_livre)}`) : ""}
      ${p.duberman ? ligne("Source", `${esc(p.src)}<br><span class="legende">chapitre ${esc(p.chapitre)} · p. ${esc(p.page)} · ${esc(p.paragraphe)}</span>`) : p.scenario ? "" : ligne(srcs.length > 1 ? "Documents sources" : "Document source", liens)}
      ${p.duberman && p.notes ? ligne("Notes de Duberman", `<details><summary>source primaire citée</summary>${esc(p.notes)}</details>`) : ""}
      ${p.duberman && p.aam && p.aam.length ? ligne("Même jour (AAM)", p.aam.map(r => `<div class="renvoi">rapprochement possible : ${esc(r.activite)}<br><span class="legende">${esc(r.motif)} · ${esc(r.src)}</span></div>`).join("")) : ""}
      ${p.chronos ? ligne("Couche", `<b>${/Rumaker/.test(p.source_chronos) ? "Rumaker" : "Chronos"}</b> · ${esc(p.source_chronos)} · ${/Rumaker/.test(p.source_chronos) ? "dépouillement manuel du texte corrigé" : "extraction automatique de décembre 2025, à relire"} · ${esc(p.statut)} · date dans la source : ${esc(p.date_src)}`) : ""}
      ${p.scenario ? ligne("Couche", `<b>Scénario</b> : ${p.categorie === "scene" ? "scène" : "événement"} extrait automatiquement d'un livre (non relu) · certitude : ${esc(p.certitude)} · date dans le scénario : ${esc(p.date_scen)}`) : ""}
      ${p.scenario ? ligne("Source", esc(p.src)) : ""}
      ${p.scenario && p.versions ? ligne("Autres versions", `<details><summary>selon d'autres livres</summary><span class="legende">${esc(p.versions)}</span></details>`) : ""}
      ${p.scenario && p.recoupement ? ligne("Recoupement", p.recoupement.split(" || ").map(r => `<div class="renvoi rs">${esc(r)}</div>`).join("")) : ""}
      ${p.scen && p.scen.length ? ligne("Renvoi scénario", p.scen.map(r => `<div class="renvoi rs">${r.decision === "même fait" ? "même fait" : "même jour, même personne"} : ${esc(r.activite)} ${r.pct != null ? pctTag(r.pct) : ""}<br><span class="legende">${esc(r.src)}${r.certitude ? " · " + esc(r.certitude) : ""}</span></div>`).join("")) : ""}
      ${p.dub && p.dub.length ? ligne("Renvoi Duberman", p.dub.map(r => `<div class="renvoi">${r.decision === "doublon" ? "même événement" : "rapprochement possible"} : ${esc(r.activite)} ${pctTag(r.pct)}<br><span class="legende">${esc(r.motif)} · ${esc(r.src)}</span>${r.notes ? `<details><summary>notes de Duberman</summary><span class="legende">${esc(r.notes)}</span></details>` : ""}</div>`).join("")) : ""}
      ${p.duberman || p.scenario ? "" : ligne("Inventaire", esc(p.inv))}
      ${doc && doc.img ? ligne("Vue", `<a href="${esc(urls[0])}" target="_blank"><img src="${esc(doc.img)}" style="max-width:220px;border:1px solid #ddd"></a>`) : ""}
    </dl>${blocVerif(ev.id, p)}`;
  document.getElementById("voile").classList.add("on");
  if (!window.BMC_VERIF && !p.verif) chargerVerif().then(() => { if (ficheOuverte() && document.getElementById("verifBloc")) fiche(ev); });
}
function analyse(k) {
  const md = ((D.spec || {})[k] || {}).analyse; if (!md) return;
  const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>").replace(/`(.+?)`/g, "<code>$1</code>");
  let h = "", liste = false;
  for (const l of md.split("\n")) {
    if (/^- /.test(l)) { if (!liste) { h += "<ul>"; liste = true; } h += `<li>${inl(l.slice(2))}</li>`; continue; }
    if (/^  /.test(l) && liste) { h = h.replace(/<\/li>$/, "<br>" + inl(l.trim()) + "</li>"); continue; }
    if (liste) { h += "</ul>"; liste = false; }
    if (/^# /.test(l)) h += `<h3>${inl(l.slice(2))}</h3>`;
    else if (/^##+ /.test(l)) h += `<h4>${inl(l.replace(/^#+ /, ""))}</h4>`;
    else if (/^\|/.test(l)) { if (!/^\|---/.test(l)) h += `<table><tr>${l.split("|").slice(1, -1).map(c => `<td>${inl(c.trim())}</td>`).join("")}</tr></table>`; }
    else if (l.trim()) h += `<p>${inl(l)}</p>`;
  }
  if (liste) h += "</ul>";
  document.getElementById("fiche").innerHTML = `<button class="fermer" onclick="fermer()">fermer</button>${h}`;
  document.getElementById("voile").classList.add("on");
}
function fermer() { document.getElementById("voile").classList.remove("on"); }
document.getElementById("voile").onclick = e => { if (e.target.id === "voile") fermer(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") fermer(); });

// ---- commandes
function maj() {
  ec.refetchEvents();
  const v = ec.getView(); cote(v.currentStart, v.currentEnd); majHash();
}
const fams = document.getElementById("familles");
FAMILLES.forEach(([k, lib, c]) => {
  const l = document.createElement("label"); l.className = "fam";
  l.innerHTML = `<input type="checkbox" checked><i style="background:${c}"></i>${lib}`;
  l.querySelector("input").onchange = e => { e.target.checked ? etat.familles.add(k) : etat.familles.delete(k); maj(); };
  fams.appendChild(l);
});
const qEl = document.getElementById("q");
let tq; qEl.oninput = () => { clearTimeout(tq); tq = setTimeout(() => { etat.q = qEl.value; maj(); }, 200); };
document.getElementById("spec").onchange = e => { etat.spec = e.target.checked; maj(); };
document.getElementById("dub").onchange = e => { etat.dub = e.target.checked; maj(); };
document.getElementById("scen").onchange = e => { etat.scen = e.target.checked; maj(); };
document.getElementById("chr").onchange = e => { etat.chr = e.target.checked; maj(); };
if (!window.BMC_CHRONOS) document.getElementById("chr").closest("label").style.display = "none";
document.getElementById("verifSeul").onchange = e => { etat.verifSeul = e.target.checked; if (etat.verifSeul) chargerVerif().then(maj); else maj(); };
if (!window.BMC_SCEN) document.getElementById("scen").closest("label").style.display = "none";
document.getElementById("maxPct").onchange = e => { etat.maxPct = +e.target.value; maj(); };
document.querySelectorAll("[data-vue]").forEach(b => b.onclick = () => vue(b.dataset.vue));
function vue(v) {
  ec.setOption("view", v);
  document.querySelectorAll("[data-vue]").forEach(x => x.classList.toggle("on", x.dataset.vue === v));
  majHash();
}
function aller(d) { if (d) ec.setOption("date", d); }
document.getElementById("saut").onchange = e => aller(e.target.value);
function voisin(sens) {
  const v = ec.getView(), a = iso(v.currentStart), b = iso(v.currentEnd);
  const d = sens > 0 ? JOURS.find(j => j >= b) : [...JOURS].reverse().find(j => j < a);
  if (d) aller(d);
}
document.getElementById("suivSem").onclick = () => voisin(1);
document.getElementById("precSem").onclick = () => voisin(-1);

// repères : premières semaines de trimestre attestées + semaines les plus documentées
const rep = document.getElementById("reperes");
const parSem = {};
D.events.forEach(e => { const d = new Date(e.start.slice(0, 10) + "T12:00"); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); const k = iso(d); parSem[k] = (parSem[k] || 0) + 1; });
rep.innerHTML += `<optgroup label="Années reconstituées (spéculatif)">${Object.entries(D.spec || {}).map(([k, Y]) => `<option value="${Y.semaines[0].lundi}">${k} · ${Y.semaines.length} semaines</option>`).join("")}</optgroup>`;
const plusDoc = Object.entries(parSem).sort((x, y) => y[1] - x[1]).slice(0, 12).sort();
rep.innerHTML += `<optgroup label="Semaines les plus documentées">${plusDoc.map(([k, n]) => `<option value="${k}">${k} · ${n} activités</option>`).join("")}</optgroup>`;
const termes = D.periodes.filter(p => /term|quarter|semester|session|institute/i.test(p.libelle) && !/vacation|recess/i.test(p.libelle));
rep.innerHTML += `<optgroup label="Débuts de trimestre et sessions">${termes.map(p => `<option value="${p.debut}">${p.debut} · ${esc(p.libelle)}</option>`).join("")}</optgroup>`;
rep.onchange = () => { aller(rep.value); rep.value = ""; };

// adresse partageable : #2024-01-01/vue
function majHash() {
  const v = ec.getView();
  const d = iso(ec.getOption("date")); document.getElementById("saut").value = d;
  history.replaceState(null, "", `#${d}/${v.type}`);
}
(function lireHash() {
  const m = location.hash.match(/^#(\d{4}-\d{2}-\d{2})(?:\/(\w+))?/);
  if (m) { aller(m[1]); if (m[2]) vue(m[2]); }
})();
</script>
